<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administration | Biboulab</title>
  <!-- Page de gestion : fonctionne uniquement avec  node outils/serveur-local.js  (http://localhost:4173/admin) -->
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <style>
    body { overflow: hidden; height: 100vh; display: grid; grid-template-rows: auto auto 1fr; }
    .a-top { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 24px; border-bottom: 1px solid var(--line); }
    .a-top .logo { margin-right: 0; }
    .a-top .sub { color: var(--faint); font-size: .875rem; }
    .a-status { margin-left: auto; font-size: .875rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .a-status i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
    .a-status.dirty i { background: var(--orange); }
    .a-status.saved i { background: var(--ok); }
    .a-status.bad { color: var(--err); } .a-status.bad i { background: var(--err); }
    .a-top .btn { min-height: 40px; padding: 0 16px; font-size: .9375rem; }
    .a-warn { padding: 12px 24px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: .9375rem; }
    .a-warn code, .hint code { font: .875em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
    .a-shell { display: grid; grid-template-columns: 360px 1fr; min-height: 0; }
    .a-side { border-right: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; min-height: 0; background: var(--surface); }
    .a-tools { padding: 16px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
    .a-tools .input, .a-tools .select { min-height: 40px; padding: 8px 12px; background: var(--bg); }
    .a-tools .field > .ic ~ .input { padding-left: 40px; }
    .a-tools .field > .ic { left: 12px; }
    .a-tools .btn { min-height: 40px; }
    .a-list { overflow-y: auto; padding: 8px; }
    .t-two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .t-two button { min-height: 32px; border-radius: 8px; font-size: .8125rem; color: var(--muted); transition: background-color .18s var(--ease), color .18s var(--ease); }
    .t-two button:hover { background: var(--surface-2); color: var(--text); }
    .t-cat + .t-cat { margin-top: 2px; }
    .t-row { position: relative; display: flex; align-items: center; border-radius: 8px; transition: background-color .18s var(--ease); }
    .t-row:hover { background: var(--surface-2); }
    .t-row[aria-current="true"] { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-2); }
    .t-tog, .t-add { width: 32px; height: 40px; flex: none; display: grid; place-items: center; color: var(--faint); border-radius: 8px; transition: color .18s var(--ease); }
    .t-tog:hover, .t-add:hover { color: var(--text); }
    .t-tog .ic { width: 16px; height: 16px; transform: rotate(-90deg); transition: transform .18s var(--ease); }
    .t-tog[aria-expanded="true"] .ic { transform: none; }
    .t-add .ic { width: 16px; height: 16px; }
    .t-pick { flex: 1; min-width: 0; min-height: 40px; display: flex; align-items: center; gap: 8px; text-align: left; cursor: grab; }
    .t-pick b { flex: 1; min-width: 0; font-weight: 500; font-size: .9375rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-pick .num { color: var(--faint); font-size: .8125rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .t-head .dd-ic { width: 28px; height: 28px; } .t-head .dd-ic .ic { width: 16px; height: 16px; }
    .t-kids { margin: 2px 0 8px 16px; padding-left: 12px; border-left: 1px solid var(--line); }
    .t-leaf .t-pick { min-height: 36px; padding: 0 12px 0 8px; }
    .t-leaf .t-pick b { font-weight: 400; font-size: .875rem; color: var(--muted); }
    .t-leaf:hover .t-pick b, .t-leaf[aria-current="true"] .t-pick b { color: var(--text); }
    .t-none { margin: 0; padding: 8px; color: var(--faint); font-size: .8125rem; }
    .t-row.dragging { opacity: .4; }
    .t-row.drop-in { box-shadow: inset 0 0 0 2px var(--accent); }
    .t-row.drop-before::before, .t-row.drop-after::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; border-radius: 1px; background: var(--accent); pointer-events: none; }
    .t-row.drop-before::before { top: -2px; } .t-row.drop-after::after { bottom: -2px; }
    .a-none { padding: 24px 16px; color: var(--faint); font-size: .875rem; text-align: center; }
    .a-main { overflow-y: auto; padding: 32px; }
    .a-form { max-width: 820px; margin-inline: auto; }
    .a-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 32px; }
    .a-head h1 { font-size: 1.75rem; line-height: 1.15; letter-spacing: 0; }
    .a-head p { margin: 8px 0 0; color: var(--muted); font-size: .875rem; }
    .a-head .acts { margin-left: auto; display: flex; gap: 8px; flex: none; }
    .a-head .btn { min-height: 40px; padding: 0 12px; font-size: .875rem; }
    .btn-danger:hover { border-color: var(--err); color: var(--err); }
    .a-sec { padding: 24px 0; border-top: 1px solid var(--line); }
    .a-sec > h2 { font: 500 1rem/1.3 var(--font-b); letter-spacing: 0; margin-bottom: 16px; }
    .a-sec .form { gap: 16px; }
    .third { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; grid-column: 1 / -1; }
    .hint { color: var(--faint); font-size: .8125rem; margin: 4px 0 0; }
    .fg label small { color: var(--faint); font-weight: 400; }
    .input[readonly] { color: var(--muted); background: var(--surface-2); }
    .textarea { min-height: 96px; }
    .picks { display: flex; flex-wrap: wrap; gap: 8px; }
    .pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .pick span { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r-s); border: 1px solid var(--line-2); color: var(--muted); transition: background-color .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease); }
    .pick:hover span { background: var(--surface-2); }
    .pick input:checked + span { background: var(--text); border-color: var(--text); color: var(--bg); }
    .pick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tint { display: flex; gap: 8px; align-items: center; }
    .tint input[type=color] { width: 48px; height: 48px; flex: none; padding: 4px; border-radius: var(--r-s); border: 1px solid var(--line-2); background: var(--surface); }
    .fil { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px 0 8px; border-radius: 8px; border: 1px solid var(--line-2); font-size: .875rem; transition: background-color .18s var(--ease), border-color .18s var(--ease); }
    .fil:has(input:checked) { border-color: var(--text); background: var(--surface-2); }
    .fil input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .fil:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
    .fil i { width: 20px; height: 20px; border-radius: 50%; background: var(--sw); border: 1px solid var(--line-2); }
    .rows { display: grid; gap: 8px; }
    .rowline { display: grid; grid-template-columns: 1fr 140px 44px; gap: 8px; align-items: center; }
    .rowline.img { grid-template-columns: 48px 1fr 44px; }
    .rowline img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--surface-2); }
    .rm { width: 44px; height: 44px; border-radius: var(--r-s); display: grid; place-items: center; color: var(--muted); transition: background-color .18s var(--ease), color .18s var(--ease); }
    .rm:hover { background: var(--surface-2); color: var(--err); }
    .rows + .btn, .rows + .hint + .btn { margin-top: 12px; }
    .a-sec .btn-sm { min-height: 40px; }
    .preview { display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: start; }
    .preview .cat, .preview .card { transform: none; }
    .preview .cat { min-height: 200px; }
    .a-empty { height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted); }
    .a-empty h1 { font: 500 1.25rem/1.3 var(--font-b); color: var(--text); margin-bottom: 8px; letter-spacing: 0; }
    [hidden] { display: none !important; }
    .a-warn { grid-row: 2; } .a-shell, .o-view { grid-row: 3; }

    /* ---------- Onglets ---------- */
    .a-tabs { display: flex; gap: 4px; }
    .a-tab { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 8px; font-size: .9375rem; color: var(--muted); transition: background-color .18s var(--ease), color .18s var(--ease); }
    .a-tab:hover { background: var(--surface-2); color: var(--text); }
    .a-tab[aria-current="page"] { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
    .a-tab .num { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--text); color: var(--bg); font-size: .75rem; font-weight: 500; display: grid; place-items: center; font-variant-numeric: tabular-nums; }

    /* ---------- Commandes : tableau façon Trello ---------- */
    .o-view { --col: var(--surface); --card: var(--surface-2); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
    [data-theme="light"] .o-view, [data-theme="light"] .o-dlg { --col: var(--surface-2); --card: var(--surface); }
    .o-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
    .o-bar .field { flex: 0 1 340px; }
    .o-bar .input { min-height: 40px; padding: 8px 12px 8px 40px !important; background: var(--surface); }
    .o-bar .field > .ic { left: 12px; }
    .o-bar .btn { min-height: 40px; padding: 0 14px; font-size: .875rem; }
    .o-bar .btn[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
    .o-sum { margin: 0 0 0 auto; color: var(--muted); font-size: .875rem; }
    .o-board { min-height: 0; overflow: auto; padding: 16px 24px 24px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(288px, 340px); gap: 12px; align-items: start; }
    .o-col { max-height: 100%; min-height: 0; display: flex; flex-direction: column; background: var(--col); border: 1px solid var(--line); border-radius: 14px; transition: box-shadow .18s var(--ease); }
    .o-col.drop { box-shadow: inset 0 0 0 2px var(--accent); }
    .o-ch { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
    .o-ch h2 { font: 500 .9375rem/1.3 var(--font-b); letter-spacing: 0; }
    .o-ch .num { color: var(--faint); font-size: .8125rem; font-variant-numeric: tabular-nums; }
    .o-list { flex: 1; min-height: 48px; overflow-y: auto; padding: 4px 8px; display: grid; gap: 8px; align-content: start; }
    .o-list.drop-end::after { content: ""; height: 2px; border-radius: 1px; background: var(--accent); }
    .o-empty { margin: 0; padding: 14px 8px; border: 1px dashed var(--line-2); border-radius: 10px; color: var(--faint); font-size: .8125rem; text-align: center; }
    .o-add { display: flex; align-items: center; gap: 8px; min-height: 40px; margin: 4px 8px 8px; padding: 0 8px; border-radius: 8px; color: var(--muted); font-size: .875rem; transition: background-color .18s var(--ease), color .18s var(--ease); }
    .o-add:hover { background: var(--card); color: var(--text); }
    .o-add .ic { width: 16px; height: 16px; }

    .o-card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: grab; transition: border-color .18s var(--ease), box-shadow .18s var(--ease), opacity .18s var(--ease); }
    .o-card:hover { border-color: var(--line-2); }
    .o-card:has(.o-open:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
    .o-card.dragging { opacity: .4; }
    .o-card.drop-before::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--accent); z-index: 2; }
    .o-cover { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; height: 112px; background: var(--line); }
    .o-cv { width: 100%; height: 100%; object-fit: cover; }
    .o-cb { padding: 10px 12px 12px; }
    .o-labels { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .o-lab { display: inline-flex; align-items: center; min-height: 20px; padding: 0 8px; border-radius: 4px; font-size: .75rem; font-weight: 500; background: var(--line); color: var(--muted); }
    .o-lab.ok { background: color-mix(in oklab, var(--ok) 18%, transparent); color: color-mix(in oklab, var(--ok) 72%, var(--text)); }
    .o-lab.due { background: color-mix(in oklab, var(--orange) 18%, transparent); color: color-mix(in oklab, var(--orange) 72%, var(--text)); }
    .o-card h3 { font: 500 .9375rem/1.35 var(--font-b); letter-spacing: 0; }
    .o-open { text-align: left; }
    .o-open::after { content: ""; position: absolute; inset: 0; z-index: 1; } /* toute la carte ouvre la fiche */
    .o-open:focus-visible { outline: none; }
    .o-sub { margin: 2px 0 0; color: var(--faint); font-size: .8125rem; }
    .o-items { margin-top: 8px; display: grid; gap: 2px; font-size: .8125rem; color: var(--muted); }
    .o-items li { display: flex; gap: 6px; }
    .o-items .o-q { color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
    .o-items small { color: var(--faint); font-size: inherit; }
    .o-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .o-foot b { font-weight: 500; font-size: .875rem; font-variant-numeric: tabular-nums; }
    .o-next { position: relative; z-index: 2; margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); font-size: .8125rem; color: var(--muted); transition: background-color .18s var(--ease), color .18s var(--ease); }
    .o-next:hover { background: var(--col); color: var(--text); }
    .o-next .ic { width: 14px; height: 14px; }
    .o-msg { grid-column: 1 / -1; max-width: 520px; margin: 48px auto; text-align: center; color: var(--muted); }
    .o-msg h2 { font: 500 1.25rem/1.3 var(--font-b); color: var(--text); margin-bottom: 8px; letter-spacing: 0; }
    .o-msg code { font: .875em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }

    /* Commandes livrées */
    .o-done { grid-auto-flow: row; grid-auto-columns: auto; align-content: start; gap: 8px; max-width: 960px; width: 100%; margin-inline: auto; }
    .o-done h2 { font: 500 1rem/1.3 var(--font-b); letter-spacing: 0; margin: 8px 0 4px; }
    .o-row { position: relative; display: grid; grid-template-columns: 1fr auto auto auto; gap: 16px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--col); font-size: .875rem; }
    .o-row:hover { border-color: var(--line-2); }
    .o-row .o-open b { font-weight: 500; } .o-row .o-open span { color: var(--faint); }
    .o-row .num { color: var(--faint); font-variant-numeric: tabular-nums; }
    .o-row .o-next { margin: 0; }

    /* Vignettes produits */
    .o-th { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex: none; }
    .o-lth { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; }
    .o-art { position: relative; display: grid; place-items: center; background: #14141c; overflow: hidden; }
    .o-art::before { content: ""; position: absolute; inset: 14%; border-radius: 50%; background: linear-gradient(140deg, var(--c), var(--c2)); opacity: .92; }
    .o-art .ic { position: relative; width: 38%; height: 38%; color: #fff; }
    .o-art.o-none { background: var(--surface-2); } .o-art.o-none::before { display: none; } .o-art.o-none .ic { color: var(--faint); }
    .o-cover .o-art .ic { width: 40px; height: 40px; }
    .o-cover .o-art::before { inset: auto; width: 84px; height: 84px; }

    /* Fiche d'une commande (s'ouvre au clic, comme le dos d'une carte Trello) */
    .o-dlg { width: min(940px, 100% - 32px); max-height: calc(100% - 48px); padding: 0; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg); color: var(--text); box-shadow: var(--shadow); }
    .o-dlg::backdrop { background: rgba(5, 6, 9, .64); }
    .o-dlg.o-small { width: min(620px, 100% - 32px); }
    .o-dlg .input, .o-dlg .select { min-height: 40px; padding: 8px 12px; }
    .o-dlg .select { padding-right: 36px; }
    .o-dlg .textarea { min-height: 80px; padding: 10px 12px; }
    .o-dlg .fg + .fg { margin-top: 12px; }
    .o-dlg .fg label { margin-bottom: 6px; font-size: .8125rem; color: var(--muted); }
    .o-in-wrap { display: grid; grid-template-columns: 1fr 272px; gap: 0 32px; padding: 20px 24px 24px; }
    .o-dh { grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 16px; padding-bottom: 16px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
    .o-dh > div { flex: 1; min-width: 0; }
    .o-title { width: 100%; font: 500 1.375rem/1.3 var(--font-b); padding: 4px 8px; margin-left: -8px; border-radius: 8px; border: 1px solid transparent; background: none; }
    .o-title:hover { background: var(--surface); }
    .o-title:focus { outline: none; border-color: var(--accent); background: var(--surface); }
    .o-where { margin: 4px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: .875rem; }
    .o-where .select { width: auto; min-height: 32px; padding: 4px 32px 4px 10px; font-size: .875rem; background-position: right 8px center; background-size: 16px; }
    .o-x { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 8px; color: var(--muted); transition: background-color .18s var(--ease), color .18s var(--ease); }
    .o-x:hover { background: var(--surface-2); color: var(--text); }
    .o-x .ic { transform: rotate(45deg); }
    .o-ds { padding: 16px 0; }
    .o-ds + .o-ds { border-top: 1px solid var(--line); }
    .o-dlg h3 { font: 500 .9375rem/1.3 var(--font-b); letter-spacing: 0; margin-bottom: 12px; }
    .o-side section { padding: 16px 0; } .o-side section + section { border-top: 1px solid var(--line); }
    .o-side .btn { width: 100%; min-height: 40px; font-size: .875rem; margin-top: 8px; }
    .o-mailto { display: inline-block; margin-top: 8px; font-size: .8125rem; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
    .o-mailto:hover { color: var(--text); }
    .o-check { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: .875rem; cursor: pointer; }
    .o-check input { width: 18px; height: 18px; accent-color: var(--ok); }

    /* Recherche d'un objet du site */
    .o-find { position: relative; margin-bottom: 12px; }
    .o-find .input { padding-left: 40px !important; background: var(--surface); }
    .o-find .field > .ic { left: 12px; }
    .o-res { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; right: 0; max-height: 340px; overflow-y: auto; padding: 4px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); }
    .o-opt { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
    .o-opt[aria-selected="true"] { background: var(--surface-2); }
    .o-opt b { display: block; font-weight: 500; font-size: .875rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .o-opt small { display: block; color: var(--faint); font-size: .75rem; }
    .o-opt span { min-width: 0; }
    .o-opt .num { color: var(--muted); font-size: .8125rem; font-variant-numeric: tabular-nums; }
    .o-nores { margin: 0; padding: 12px; color: var(--faint); font-size: .875rem; }

    /* Lignes de la commande */
    .o-lines { display: grid; gap: 8px; }
    .o-line { display: grid; grid-template-columns: 56px 1fr auto 40px; gap: 4px 12px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .o-lname { min-width: 0; }
    .o-lname b { display: block; font-weight: 500; font-size: .9375rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .o-lname a, .o-lname small { font-size: .75rem; color: var(--faint); }
    .o-lname a { text-decoration: underline; text-underline-offset: 2px; } .o-lname a:hover { color: var(--text); }
    .o-ltot { font-weight: 500; font-size: .9375rem; font-variant-numeric: tabular-nums; }
    .o-line .rm { width: 40px; height: 40px; }
    .o-lctl { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .o-lctl .select { width: auto; flex: 1 1 0; min-width: 120px; }
    .o-lctl .input { width: 100%; }
    .o-mini { display: flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--faint); }
    .o-mini .input { width: 72px; }
    .o-mini.p .input { width: 88px; }
    .o-lctl .o-opts { flex: 1 1 160px; }
    .o-tot { margin: 16px 0 0; display: grid; gap: 4px; font-size: .875rem; }
    .o-tot div { display: flex; justify-content: space-between; color: var(--muted); }
    .o-tot dd { margin: 0; font-variant-numeric: tabular-nums; }
    .o-tot .t { color: var(--text); font-weight: 500; font-size: 1rem; padding-top: 8px; margin-top: 4px; border-top: 1px solid var(--line); }
    .o-two { display: grid; grid-template-columns: 1fr 96px; gap: 8px; }
    .o-two .fg + .fg { margin-top: 0; }

    /* Coller un e-mail */
    .o-mailf { padding: 20px 24px 24px; }
    .o-mailf .o-dh h2 { font: 500 1.125rem/1.3 var(--font-b); letter-spacing: 0; flex: 1; padding-top: 8px; }
    .o-mailf .textarea { min-height: 260px; font: .8125rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .o-err { min-height: 1.4em; margin: 8px 0 0; color: var(--err); font-size: .875rem; }
    .o-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .o-acts .btn { min-height: 40px; padding: 0 16px; font-size: .9375rem; }

    @media (max-width: 860px) {
      .a-tabs { order: 3; width: 100%; }
      .o-view { display: block; }
      .o-bar { padding: 12px 16px; } .o-bar .field { flex: 1 1 100%; } .o-sum { margin-left: 0; }
      .o-board { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: 1fr; padding: 16px; overflow: visible; }
      .o-col, .o-list { max-height: none; overflow: visible; }
      .o-row { grid-template-columns: 1fr auto; }
      .o-in-wrap { grid-template-columns: 1fr; padding: 16px; }
      .o-dlg { width: calc(100% - 16px); max-height: calc(100% - 16px); }
      .o-line { grid-template-columns: 48px 1fr 40px; } .o-lth { width: 48px; height: 48px; }
      .o-ltot { grid-column: 2; grid-row: 2; }
    }
    @media (max-width: 860px) {
      body { overflow: auto; height: auto; display: block; }
      .a-top { flex-wrap: wrap; height: auto; padding: 12px 16px; gap: 8px 12px; }
      .a-top .sub { display: none; }
      .a-shell { grid-template-columns: 1fr; }
      .a-side { border-right: 0; border-bottom: 1px solid var(--line); }
      .a-list { max-height: 280px; } .a-main { padding: 24px 16px; overflow: visible; }
      .third, .preview { grid-template-columns: 1fr; }
      .a-head { flex-wrap: wrap; } .a-head .acts { margin-left: 0; }
    }
  </style>
</head>
<body>
  <header class="a-top">
    <a class="logo" href="../index.html" target="_blank" rel="noopener" title="Ouvrir le site"><span class="logo-a">Biboulab</span></a>
    <nav class="a-tabs" aria-label="Sections de l'administration">
      <a class="a-tab" href="#catalogue" data-tab="catalogue">Catalogue</a>
      <a class="a-tab" href="#commandes" data-tab="commandes">Commandes <span class="num" id="o-badge" hidden></span></a>
    </nav>
    <span class="sub" id="counts"></span>
    <p class="a-status" id="status" role="status"><i></i><span></span></p>
    <button class="btn btn-primary" type="button" id="save" disabled>Enregistrer</button>
  </header>
  <div class="a-warn" id="warn" hidden>
    L'enregistrement n'est pas disponible ici. Lancez <code>node outils/serveur-local.js</code> dans le dossier du site, puis ouvrez <code>http://localhost:4173/admin</code>
  </div>
  <div class="a-shell">
    <aside class="a-side">
      <div class="a-tools" id="tools"></div>
      <div class="a-list" id="list"></div>
    </aside>
    <main class="a-main" id="main"></main>
  </div>
  <section class="o-view" id="orders" aria-label="Suivi des commandes" hidden>
    <div class="o-bar">
      <div class="field"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><label class="sr" for="o-q">Rechercher une commande</label><input class="input" id="o-q" type="search" placeholder="Client, référence, objet…" autocomplete="off"></div>
      <button class="btn btn-ghost" type="button" id="o-paste">Coller un e-mail de commande</button>
      <button class="btn btn-ghost" type="button" id="o-done" aria-pressed="false">Livrées</button>
      <p class="o-sum" id="o-sum"></p>
    </div>
    <div class="o-board" id="board"></div>
  </section>
  <dialog class="o-dlg" id="o-dlg"></dialog>
  <dialog class="o-dlg o-small" id="o-mail" aria-labelledby="o-mail-h">
    <form class="o-mailf" id="o-mailf" novalidate>
      <div class="o-dh"><h2 id="o-mail-h">Créer une commande depuis un e-mail</h2><button class="o-x" type="button" data-close aria-label="Fermer"></button></div>
      <label class="hint" for="o-mailt" style="display:block;margin:0 0 12px">Copiez tout le texte de l'e-mail « Commande GF-… » reçu depuis le site et collez-le ici. Les objets du site sont reconnus avec leur photo, le client et l'adresse sont remplis</label>
      <textarea class="textarea" id="o-mailt" spellcheck="false"></textarea>
      <p class="o-err" id="o-mailerr" role="alert"></p>
      <div class="o-acts"><button class="btn btn-ghost" type="button" data-close>Annuler</button><button class="btn btn-primary" type="submit">Créer la commande</button></div>
    </form>
  </dialog>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/icons.js"></script>
  <script>
  (() => {
    "use strict";
    const { SITE, FILAMENTS, CATEGORIES, PRODUCTS } = window.SHOP;
    const ICONS = window.SHOP_ICONS;
    /* Icônes proposées pour une catégorie (les 8 d'origine + les icônes génériques) */
    const CAT_ICONS = ["noel", "figurine", "deco", "halloween", "architecture", "bureau", "cuisine", "reparation", "cube", "box", "etoile", "coeur", "cadeau", "jeu", "plante", "lumiere", "auto", "musique", "animal"].filter((n) => ICONS[n]);
    const FX = [["glow", "Aucun"], ["snow", "Flocons de neige"], ["fog", "Brouillard"], ["grid", "Quadrillage de plan"]];
    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => [...r.querySelectorAll(s)];
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const euro = (n) => (+n || 0).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
    const icon = (n) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ""}</svg>`;
    const slugify = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    const today = () => new Date().toISOString().slice(0, 10);
    const ID = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;

    const st = {
      sel: null,           // catégorie ou objet affiché à droite
      q: "", open: new Set(),
      cats: structuredClone(CATEGORIES), prods: structuredClone(PRODUCTS),
      fresh: new Set(),    // éléments créés dans cette session : leur identifiant suit encore le nom
      manualId: new Set(), // … sauf si l'identifiant a été retouché à la main
      dirty: false, canSave: false
    };
    st.cats.forEach((c) => st.open.add(c));
    const catOf = (slug) => st.cats.find((c) => c.slug === slug);
    const cur = () => st.sel;
    const isP = () => st.prods.includes(st.sel);
    const inCat = (c) => st.prods.filter((p) => p.category === c.slug);
    /* Sous-catégories : une catégorie porte  parent: "slug"  quand elle est rangée dans une autre */
    const parentA = (c) => (c.parent ? catOf(c.parent) : null);
    const kidsOf = (c) => st.cats.filter((x) => x.parent === c.slug);
    const rootsA = () => st.cats.filter((c) => !parentA(c));
    const siblings = (c) => (parentA(c) ? kidsOf(parentA(c)) : rootsA());
    const below = (c) => { const out = [c]; for (const x of out) kidsOf(x).forEach((k) => out.includes(k) || out.push(k)); return out; }; // elle-même + toutes ses sous-catégories
    const inTree = (c) => { const all = below(c).map((x) => x.slug); return st.prods.filter((p) => all.includes(p.category)); };
    const pathName = (c) => { const out = []; for (let x = c; x && !out.includes(x); x = parentA(x)) out.unshift(x); return out.map((x) => x.name || x.slug).join(" › "); };

    /* ---------- Barre du haut ---------- */
    /* Chaque onglet a son propre état (catalogue : bouton Enregistrer ; commandes : enregistrement automatique) */
    let tab = "catalogue";
    const ST = { catalogue: ["", "Aucune modification"], commandes: ["", "Enregistrement automatique"] };
    function paintStatus() { const [kind, text] = ST[tab], el = $("#status"); el.className = "a-status " + kind; $("span", el).textContent = text; }
    function status(kind, text, which = "catalogue") { ST[which] = [kind, text]; if (which === tab) paintStatus(); }
    function touch() { st.dirty = true; status("dirty", "Modifications non enregistrées"); $("#save").disabled = !st.canSave; counts(); }
    function counts() { const c = st.cats.length, p = st.prods.length; $("#counts").textContent = `${c} catégorie${c > 1 ? "s" : ""} · ${p} objet${p > 1 ? "s" : ""}`; }

    /* ---------- Arborescence : catégories, et leurs objets en dessous ---------- */
    function tools() {
      $("#tools").innerHTML = `
        <button class="btn btn-primary" type="button" id="add">${icon("plus")} Nouvelle catégorie</button>
        <div class="field">${icon("search")}<label class="sr" for="q">Rechercher</label><input class="input" id="q" type="search" placeholder="Rechercher" autocomplete="off" value="${esc(st.q)}"></div>
        <div class="t-two"><button type="button" id="open-all">Tout déplier</button><button type="button" id="close-all">Tout replier</button></div>`;
      $("#add").addEventListener("click", () => addCat());
      $("#q").addEventListener("input", (e) => { st.q = e.target.value; list(); });
      $("#open-all").addEventListener("click", () => { st.cats.forEach((c) => st.open.add(c)); list(); });
      $("#close-all").addEventListener("click", () => { st.open.clear(); list(); });
    }
    function list() {
      const q = slugify(st.q);
      const match = (p) => slugify(p.name + " " + p.id).includes(q);
      const hit = (c) => !q || slugify(c.name).includes(q) || inCat(c).some(match) || kidsOf(c).some(hit);
      const leaf = (p) => `<div class="t-row t-leaf" draggable="true" data-kind="prod" data-i="${st.prods.indexOf(p)}" aria-current="${p === st.sel}">
              <button class="t-pick" type="button" data-pick="prod" data-i="${st.prods.indexOf(p)}"><b>${esc(p.name) || "Sans nom"}</b><span class="num">${euro(p.price)}</span></button></div>`;
      const node = (c) => {
        if (!hit(c)) return "";
        const ci = st.cats.indexOf(c), own = inCat(c), kids = q ? own.filter(match) : own, subs = kidsOf(c);
        const open = q ? true : st.open.has(c), name = esc(c.name) || "Sans nom";
        return `<div class="t-cat">
          <div class="t-row t-head" draggable="true" data-kind="cat" data-i="${ci}" aria-current="${c === st.sel}">
            <button class="t-tog" type="button" data-tog="${ci}" aria-expanded="${open}" aria-label="Déplier ou replier ${name}">${icon("chevron")}</button>
            <button class="t-pick" type="button" data-pick="cat" data-i="${ci}"><span class="dd-ic" style="--c:${esc(c.color)}">${icon(c.icon)}</span><b>${name}</b><span class="num">${inTree(c).length}</span></button>
            <button class="t-add" type="button" data-addin="${ci}" title="Ajouter un objet dans ${name}" aria-label="Ajouter un objet dans ${name}">${icon("plus")}</button>
          </div>
          ${open ? `<div class="t-kids">${subs.map(node).join("")}${kids.map(leaf).join("")}${subs.length || kids.length ? "" : `<p class="t-none">Vide. Utilisez le + ou glissez un élément ici</p>`}</div>` : ""}
        </div>`;
      };
      $("#list").innerHTML = rootsA().map(node).join("") || `<p class="a-none">Aucun résultat</p>`;
    }
    const tree = $("#list");
    tree.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.tog !== undefined) { const c = st.cats[+b.dataset.tog]; st.open.has(c) ? st.open.delete(c) : st.open.add(c); return list(); }
      if (b.dataset.addin !== undefined) return addProduct(st.cats[+b.dataset.addin]);
      if (b.dataset.pick) { st.sel = (b.dataset.pick === "cat" ? st.cats : st.prods)[+b.dataset.i]; list(); form(); $("#main").scrollTop = 0; }
    });

    /* Glisser-déposer : réordonner les catégories, déplacer ou réordonner les objets */
    let drag = null;
    const clearDrop = () => $$(".drop-in, .drop-before, .drop-after", tree).forEach((r) => r.classList.remove("drop-in", "drop-before", "drop-after"));
    function target(e) {
      const row = e.target.closest(".t-row") || (e.target.closest(".t-cat") && $(".t-head", e.target.closest(".t-cat")));
      if (!row || !drag) return null;
      const kind = row.dataset.kind, it = (kind === "cat" ? st.cats : st.prods)[+row.dataset.i];
      if (it === drag.it) return null;
      const r = row.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
      if (drag.kind === "cat") { // bord haut ou bas : à côté ; milieu : dedans (sous-catégorie)
        if (kind !== "cat" || below(drag.it).includes(it)) return null;
        const y = (e.clientY - r.top) / r.height;
        return { row, it, mode: y < 0.3 ? "before" : y > 0.7 ? "after" : "in" };
      }
      return { row, it, mode: kind === "cat" ? "in" : after ? "after" : "before" };
    }
    tree.addEventListener("dragstart", (e) => {
      const row = e.target.closest(".t-row"); if (!row) return;
      drag = { kind: row.dataset.kind, it: (row.dataset.kind === "cat" ? st.cats : st.prods)[+row.dataset.i] };
      e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", drag.it.name || "");
      requestAnimationFrame(() => row.classList.add("dragging"));
    });
    tree.addEventListener("dragover", (e) => {
      const t = target(e); clearDrop(); if (!t) return;
      e.preventDefault(); e.dataTransfer.dropEffect = "move"; t.row.classList.add("drop-" + t.mode);
    });
    tree.addEventListener("dragleave", (e) => { if (!tree.contains(e.relatedTarget)) clearDrop(); });
    tree.addEventListener("dragend", () => { drag = null; clearDrop(); $$(".dragging", tree).forEach((r) => r.classList.remove("dragging")); });
    tree.addEventListener("drop", (e) => {
      const t = target(e); if (!t) return; e.preventDefault();
      const it = drag.it, arr = drag.kind === "cat" ? st.cats : st.prods;
      arr.splice(arr.indexOf(it), 1);
      if (t.mode === "in") { if (drag.kind === "cat") it.parent = t.it.slug; else it.category = t.it.slug; st.open.add(t.it); arr.push(it); }
      else {
        if (drag.kind === "prod") it.category = t.it.category;
        else if (parentA(t.it)) it.parent = t.it.parent; else delete it.parent;
        arr.splice(arr.indexOf(t.it) + (t.mode === "after" ? 1 : 0), 0, it);
      }
      drag = null; touch(); list(); form();
    });

    /* ---------- Ajouts et suppressions ---------- */
    function uniqueId(base, taken) { let id = base || "nouveau", n = 2; while (taken.includes(id)) id = `${base || "nouveau"}-${n++}`; return id; }
    function addProduct(c) {
      c = c || (isP() ? catOf(st.sel.category) : st.sel) || st.cats[0];
      const p = { id: uniqueId("nouvel-objet", st.prods.map((x) => x.id)), name: "", category: c.slug, price: 10, badge: "new", popularity: 50, date: today(),
        short: "", description: "", colors: [], sizes: [], material: "PLA", printTime: "", dimensions: "", weight: "", images: [], model3d: "" };
      st.prods.push(p); st.fresh.add(p); st.open.add(c); st.sel = p; st.q = ""; $("#q").value = ""; touch(); list(); form(); $("#f-name").focus();
    }
    function addCat(parent) {
      const c = { slug: uniqueId("nouvelle-categorie", st.cats.map((x) => x.slug)), name: "", icon: "cube", color: "#8B5CF6", color2: "#22D3EE", fx: "glow", short: "", description: "" };
      if (parent) { c.parent = parent.slug; c.color = parent.color; c.color2 = parent.color2; c.icon = parent.icon; st.open.add(parent); }
      st.cats.push(c); st.fresh.add(c); st.open.add(c); st.sel = c; st.q = ""; $("#q").value = ""; touch(); list(); form(); $("#f-name").focus();
      const row = $('.t-row[aria-current="true"]', tree); if (row) row.scrollIntoView({ block: "nearest" });
    }
    function remove() {
      const it = cur(); if (!it) return;
      if (!isP()) {
        if (kidsOf(it).length) return alert("Cette catégorie contient des sous-catégories.\nDéplacez-les ou supprimez-les d'abord.");
        const n = inCat(it).length;
        if (n) return alert(`Cette catégorie contient encore ${n} objet${n > 1 ? "s" : ""}.\nDéplacez-les ou supprimez-les d'abord.`);
        if (st.cats.length === 1) return alert("Il faut garder au moins une catégorie.");
      }
      if (!confirm(`Supprimer « ${it.name || "cet élément"} » ?\nLa suppression est effective après « Enregistrer ».`)) return;
      const arr = isP() ? st.prods : st.cats;
      arr.splice(arr.indexOf(it), 1); st.sel = null; touch(); list(); form();
    }
    function move(d) {
      const c = cur(), sib = siblings(c), other = sib[sib.indexOf(c) + d]; if (!other) return; // échange avec la voisine de même niveau
      const i = st.cats.indexOf(c), j = st.cats.indexOf(other); st.cats[i] = other; st.cats[j] = c; touch(); list(); form();
    }
    function duplicate() {
      const p = cur(), copy = structuredClone(p);
      copy.id = uniqueId(p.id + "-copie", st.prods.map((x) => x.id)); copy.name = p.name + " (copie)"; copy.date = today(); copy.images = [];
      st.prods.splice(st.prods.indexOf(p) + 1, 0, copy); st.fresh.add(copy); st.manualId.add(copy); st.sel = copy; touch(); list(); form();
    }

    /* ---------- Formulaires ---------- */
    const F = (k, label, o = {}) => `<div class="fg${o.full ? " full" : ""}">
        <label for="f-${k}">${label}${o.opt ? " <small>(facultatif)</small>" : ""}</label>
        ${o.area ? `<textarea class="textarea" id="f-${k}" data-k="${k}" placeholder="${esc(o.ph || "")}">${esc(o.v ?? "")}</textarea>`
          : `<input class="input" id="f-${k}" data-k="${k}" type="${o.type || "text"}" ${o.num ? `data-num inputmode="decimal" step="${o.step || "any"}" min="0"${o.max ? ` max="${o.max}"` : ""}` : ""} value="${esc(o.v ?? "")}" placeholder="${esc(o.ph || "")}" ${o.ro ? "readonly" : ""} autocomplete="off">`}
        ${o.hint ? `<p class="hint">${o.hint}</p>` : ""}</div>`;

    function form() {
      const it = cur(), main = $("#main");
      if (!it) {
        main.innerHTML = `<div class="a-empty"><div><h1>Choisissez un élément dans l'arborescence</h1><p>Le + d'une catégorie y ajoute un objet. Glissez-déposez pour réordonner, déplacer ou créer des sous-catégories</p></div></div>`;
        return;
      }
      main.innerHTML = `<form class="a-form" novalidate>${isP() ? productForm(it) : catForm(it)}</form>`;
      preview();
    }
    const idField = (it, key, label) => F(key, label, { v: it[key], ro: !st.fresh.has(it), full: false,
      hint: st.fresh.has(it) ? "Sert à l'adresse de la page. Minuscules, chiffres et tirets" : "Fixé à la création, pour ne pas casser les liens et les paniers existants" });

    function productForm(p) {
      return `
        <header class="a-head"><div><h1>${esc(p.name) || "Nouvel objet"}</h1><p>${st.fresh.has(p) ? "Pas encore enregistré" : `<a href="../produit.html?id=${esc(p.id)}" target="_blank" rel="noopener" style="text-decoration:underline">Voir la fiche sur le site</a>`}</p></div>
          <div class="acts"><button class="btn btn-ghost" type="button" data-act="dup">Dupliquer</button><button class="btn btn-ghost btn-danger" type="button" data-act="del">${icon("trash")} Supprimer</button></div></header>
        <section class="a-sec"><h2>L'essentiel</h2><div class="form">
          ${F("name", "Nom de l'objet", { v: p.name, ph: "Dragon articulé" })}
          ${idField(p, "id", "Identifiant")}
          <div class="fg"><label for="f-category">Catégorie</label><select class="select" id="f-category" data-k="category">${st.cats.map((c) => `<option value="${esc(c.slug)}"${c.slug === p.category ? " selected" : ""}>${esc(pathName(c))}</option>`).join("")}</select></div>
          ${F("price", "Prix en euros", { v: p.price, type: "number", num: 1, step: "0.1", hint: "Prix de base, avant supplément de taille" })}
          ${F("short", "Accroche", { v: p.short, full: 1, ph: "Une phrase qui donne envie", hint: "Affichée sous le nom, sur la fiche" })}
          ${F("description", "Description", { v: p.description, full: 1, area: 1 })}
        </div></section>
        <section class="a-sec"><h2>Photos</h2>
          <div class="rows" id="imgs">${p.images.map((src, i) => `<div class="rowline img"><img src="../${esc(src)}" alt=""><input class="input" data-img="${i}" value="${esc(src)}" aria-label="Chemin de la photo ${i + 1}"><button class="rm" type="button" data-rm-img="${i}" aria-label="Retirer la photo ${i + 1}">${icon("trash")}</button></div>`).join("")}</div>
          <p class="hint">${p.images.length ? "La première photo est celle des listes" : "Sans photo, un visuel d'illustration aux couleurs de la catégorie est affiché"}. Les photos sont recadrées à 1200 px et converties en WebP</p>
          <button class="btn btn-ghost btn-sm" type="button" data-act="photo" ${st.canSave ? "" : "disabled"}>${icon("plus")} Ajouter des photos</button>
          <input type="file" id="file" accept="image/*" multiple hidden>
        </section>
        <section class="a-sec"><h2>Couleurs de filament proposées</h2>
          <div class="picks">${Object.entries(FILAMENTS).map(([k, f]) => `<label class="fil"><input type="checkbox" data-color="${esc(k)}"${p.colors.includes(k) ? " checked" : ""}><i style="--sw:${esc(f.hex)}"></i>${esc(f.name)}</label>`).join("")}</div>
          <p class="hint">La première couleur cochée est celle choisie par défaut</p>
        </section>
        <section class="a-sec"><h2>Tailles</h2>
          <div class="rows" id="sizes">${p.sizes.map((s, i) => `<div class="rowline"><input class="input" data-size="${i}" data-f="label" value="${esc(s.label)}" placeholder="15 cm" aria-label="Nom de la taille ${i + 1}"><input class="input" type="number" step="0.1" min="0" data-size="${i}" data-f="extra" value="${esc(s.extra)}" aria-label="Supplément en euros"><button class="rm" type="button" data-rm-size="${i}" aria-label="Retirer la taille ${i + 1}">${icon("trash")}</button></div>`).join("")}</div>
          <p class="hint">${p.sizes.length ? "À gauche le nom de la taille, à droite son supplément en euros (0 pour la taille de base)" : "Taille unique. Ajoutez des tailles si l'objet existe en plusieurs formats"}</p>
          <button class="btn btn-ghost btn-sm" type="button" data-act="size">${icon("plus")} Ajouter une taille</button>
        </section>
        <section class="a-sec"><h2>Fiche technique</h2><div class="form">
          ${F("material", "Matériau", { v: p.material, ph: "PLA", hint: "Le filtre de la boutique reconnaît PLA et PETG" })}
          ${F("printTime", "Temps de fabrication", { v: p.printTime, ph: "3 h 15" })}
          ${F("dimensions", "Dimensions", { v: p.dimensions, ph: "11 × 5 × 8 cm" })}
          ${F("weight", "Poids", { v: p.weight, ph: "32 g" })}
        </div></section>
        <section class="a-sec"><h2>Mise en avant</h2><div class="form"><div class="third">
          <div class="fg"><label for="f-badge">Étiquette</label><select class="select" id="f-badge" data-k="badge"><option value="">Aucune</option><option value="new"${p.badge === "new" ? " selected" : ""}>Nouveau</option><option value="best"${p.badge === "best" ? " selected" : ""}>Best-seller</option></select></div>
          ${F("date", "Date de mise en ligne", { v: p.date, type: "date", hint: "Sert au tri « Nouveautés »" })}
          ${F("popularity", "Popularité de 0 à 100", { v: p.popularity, type: "number", num: 1, step: "1", max: 100, hint: "Sert au tri « Popularité »" })}
        </div></div></section>
        <section class="a-sec"><h2>Liens et 3D</h2><div class="form">
          ${F("makerworld", "Lien MakerWorld du modèle", { v: p.makerworld, opt: 1, ph: "https://makerworld.com/…" })}
          ${F("cults3d", "Lien Cults3D du modèle", { v: p.cults3d, opt: 1, ph: "https://cults3d.com/…" })}
          ${F("model3d", "Fichier 3D pour la visionneuse", { v: p.model3d, opt: 1, full: 1, ph: "assets/modeles/dragon.glb", hint: "Déposez un fichier .glb dans le dossier du site et indiquez son chemin" })}
        </div></section>`;
    }

    function catForm(c) {
      const sib = siblings(c), i = sib.indexOf(c), n = inTree(c).length;
      return `
        <header class="a-head"><div><h1>${esc(c.name) || "Nouvelle catégorie"}</h1><p>${st.fresh.has(c) ? "Pas encore enregistrée" : `${n} objet${n > 1 ? "s" : ""} · <a href="../categorie.html?c=${esc(c.slug)}" target="_blank" rel="noopener" style="text-decoration:underline">Voir la page sur le site</a>`}</p></div>
          <div class="acts"><button class="btn btn-ghost" type="button" data-act="up" ${i === 0 ? "disabled" : ""}>Monter</button><button class="btn btn-ghost" type="button" data-act="down" ${i === sib.length - 1 ? "disabled" : ""}>Descendre</button><button class="btn btn-ghost" type="button" data-act="sub">${icon("plus")} Sous-catégorie</button><button class="btn btn-ghost btn-danger" type="button" data-act="del">${icon("trash")} Supprimer</button></div></header>
        <section class="a-sec"><h2>L'essentiel</h2><div class="form">
          ${F("name", "Nom de la catégorie", { v: c.name, ph: "Jeux de société" })}
          ${idField(c, "slug", "Identifiant")}
          <div class="fg full"><label for="f-parent">Rangée dans</label><select class="select" id="f-parent" data-k="parent"><option value="">Aucune : c'est une catégorie principale</option>${st.cats.filter((x) => !below(c).includes(x)).map((x) => `<option value="${esc(x.slug)}"${x.slug === c.parent ? " selected" : ""}>${esc(pathName(x))}</option>`).join("")}</select>
            <p class="hint">Une sous-catégorie apparaît comme filtre sur la page de sa catégorie parente, qui affiche aussi ses objets</p></div>
          ${F("short", "Résumé", { v: c.short, full: 1, ph: "Pions, rangements, accessoires", hint: "Affiché sur la carte de la catégorie, à l'accueil" })}
          ${F("description", "Description", { v: c.description, full: 1, area: 1, hint: "Affichée en haut de la page de la catégorie" })}
        </div></section>
        <section class="a-sec"><h2>Icône</h2>
          <div class="picks" role="radiogroup" aria-label="Icône de la catégorie">${CAT_ICONS.map((n) => `<label class="pick" title="${n}"><input type="radio" name="icon" data-k="icon" value="${n}"${c.icon === n ? " checked" : ""}><span>${icon(n)}</span></label>`).join("")}</div>
        </section>
        <section class="a-sec"><h2>Couleurs et ambiance</h2><div class="form"><div class="third">
          <div class="fg"><label for="f-color">Couleur principale</label><div class="tint"><input type="color" data-k="color" value="${esc(c.color)}" aria-label="Choisir la couleur principale"><input class="input" id="f-color" data-k="color" value="${esc(c.color)}"></div><p class="hint">Icône et visuels d'illustration</p></div>
          <div class="fg"><label for="f-color2">Couleur secondaire</label><div class="tint"><input type="color" data-k="color2" value="${esc(c.color2)}" aria-label="Choisir la couleur secondaire"><input class="input" id="f-color2" data-k="color2" value="${esc(c.color2)}"></div><p class="hint">Fin du dégradé des visuels</p></div>
          <div class="fg"><label for="f-fx">Effet d'ambiance</label><select class="select" id="f-fx" data-k="fx">${FX.map(([v, l]) => `<option value="${v}"${c.fx === v ? " selected" : ""}>${l}</option>`).join("")}</select></div>
        </div></div></section>
        <section class="a-sec"><h2>Aperçu</h2><div class="preview" id="preview"></div>
          <p class="hint">L'ordre des catégories est celui du menu et de l'accueil : glissez-les dans l'arborescence, ou utilisez Monter et Descendre. Déposée au milieu d'une autre, une catégorie devient sa sous-catégorie</p></section>`;
    }
    function preview() {
      const box = $("#preview"), c = cur(); if (!box || !c) return;
      const n = st.prods.filter((p) => p.category === c.slug).length;
      box.innerHTML = `<div class="cat fx-${esc(c.fx)}" style="--c:${esc(c.color)};--c2:${esc(c.color2)}"><span class="cat-ic">${icon(c.icon)}</span><h3>${esc(c.name) || "Nom de la catégorie"}</h3><p>${esc(c.short)}</p><span class="cat-n">${n} création${n > 1 ? "s" : ""} ${icon("arrow")}</span></div>
        <svg viewBox="0 0 400 240" role="img" aria-label="Aperçu du visuel d'illustration" style="border-radius:var(--r);border:1px solid var(--line)">
          <defs><linearGradient id="pv" gradientTransform="rotate(50)"><stop stop-color="${esc(c.color)}"/><stop offset="1" stop-color="${esc(c.color2)}"/></linearGradient></defs>
          <rect width="400" height="240" fill="#14141c"/><rect width="400" height="240" fill="url(#pv)" opacity=".22"/><circle cx="200" cy="120" r="84" fill="url(#pv)" opacity=".92"/>
          <g transform="translate(152 72) scale(4)" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${ICONS[c.icon] || ""}</g></svg>`;
    }

    /* ---------- Saisie : chaque champ met à jour l'élément en direct ---------- */
    const main = $("#main");
    main.addEventListener("input", (e) => {
      const t = e.target, it = cur(); if (!it) return;
      const idKey = isP() ? "id" : "slug";
      if (t.dataset.k) {
        const k = t.dataset.k;
        if (t.type === "radio" && !t.checked) return;
        let v = t.dataset.num !== undefined ? (t.value === "" ? 0 : +t.value.replace(",", ".")) : t.value;
        if (k === "badge") v = v || null;
        if (k === idKey) { v = v.toLowerCase(); st.manualId.add(it); }
        if ((k === "makerworld" || k === "cults3d" || k === "parent") && !v) delete it[k]; else it[k] = v;
        if (k === "parent" && v) st.open.add(catOf(v));
        if (k === "name") {
          $(".a-head h1").textContent = v || (isP() ? "Nouvel objet" : "Nouvelle catégorie");
          if (st.fresh.has(it) && !st.manualId.has(it)) {  // l'identifiant suit le nom tant qu'on n'y a pas touché
            const others = (isP() ? st.prods : st.cats).filter((x) => x !== it).map((x) => x[idKey]);
            const old = it[idKey]; it[idKey] = uniqueId(slugify(v), others); $(`#f-${idKey}`).value = it[idKey];
            if (!isP()) { st.prods.forEach((p) => { if (p.category === old) p.category = it[idKey]; }); st.cats.forEach((x) => { if (x.parent === old) x.parent = it[idKey]; }); }
          }
        }
        if (k === "color" || k === "color2") $$(`[data-k="${k}"]`, main).forEach((x) => { if (x !== t && /^#[0-9a-f]{6}$/i.test(v)) x.value = v; });
      } else if (t.dataset.color) {
        it.colors = $$("[data-color]:checked", main).map((x) => x.dataset.color);
      } else if (t.dataset.size !== undefined) {
        const s = it.sizes[+t.dataset.size]; s[t.dataset.f] = t.dataset.f === "extra" ? (+t.value.replace(",", ".") || 0) : t.value;
      } else if (t.dataset.img !== undefined) {
        it.images[+t.dataset.img] = t.value.trim();
      } else return;
      touch(); list(); preview();
    });
    main.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return; const it = cur();
      const act = b.dataset.act;
      if (act === "del") return remove();
      if (act === "dup") return duplicate();
      if (act === "up") return move(-1);
      if (act === "down") return move(1);
      if (act === "sub") return addCat(it);
      if (act === "size") { it.sizes.push({ label: "", extra: it.sizes.length ? 2 : 0 }); touch(); form(); const all = $$('[data-f="label"]', main); all[all.length - 1].focus(); return; }
      if (act === "photo") return $("#file").click();
      if (b.dataset.rmSize !== undefined) { it.sizes.splice(+b.dataset.rmSize, 1); touch(); form(); }
      if (b.dataset.rmImg !== undefined) { it.images.splice(+b.dataset.rmImg, 1); touch(); form(); list(); }
    });
    main.addEventListener("submit", (e) => e.preventDefault());

    /* ---------- Photos : réduites à 1200 px, converties en WebP, rangées dans assets/img/produits ---------- */
    main.addEventListener("change", async (e) => {
      if (e.target.id !== "file") return;
      const p = cur(), files = [...e.target.files]; if (!p || !files.length) return;
      if (!ID.test(p.id)) return alert("Donnez d'abord un nom à l'objet.");
      status("dirty", "Envoi des photos");
      try {
        for (const f of files) {
          const bmp = await createImageBitmap(f), k = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
          const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
          cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
          const blob = await new Promise((ok) => cv.toBlob(ok, "image/webp", 0.86));
          const name = `${p.id}-${Date.now().toString(36)}.${blob.type === "image/webp" ? "webp" : "png"}`;
          const r = await fetch(`/api/photo?nom=${encodeURIComponent(name)}`, { method: "POST", headers: { "X-Biboulab-Admin": "1", "Content-Type": "application/octet-stream" }, body: blob });
          const out = await r.json(); if (!r.ok) throw new Error(out.erreur);
          p.images.push(out.chemin);
        }
        touch(); form(); list();
      } catch (err) { status("bad", err.message || "Envoi de la photo impossible"); }
    });

    /* ---------- Enregistrement ---------- */
    function problems() {
      const seenC = new Set(), seenP = new Set();
      for (const c of st.cats) {
        const where = () => { st.sel = c; };
        if (!c.name.trim()) return where(), "Une catégorie n'a pas de nom";
        if (!ID.test(c.slug)) return where(), `Identifiant de catégorie invalide : « ${c.slug} »`;
        if (seenC.has(c.slug)) return where(), `Deux catégories ont l'identifiant « ${c.slug} »`;
        if (!/^#[0-9a-f]{6}$/i.test(c.color) || !/^#[0-9a-f]{6}$/i.test(c.color2)) return where(), `Couleur invalide pour « ${c.name} » (format #RRVVBB)`;
        seenC.add(c.slug);
      }
      for (const p of st.prods) {
        const where = () => { st.sel = p; const k = catOf(p.category); if (k) st.open.add(k); st.q = ""; };
        if (!p.name.trim()) return where(), "Un objet n'a pas de nom";
        if (!ID.test(p.id)) return where(), `Identifiant d'objet invalide : « ${p.id} »`;
        if (seenP.has(p.id)) return where(), `Deux objets ont l'identifiant « ${p.id} »`;
        if (!seenC.has(p.category)) return where(), `« ${p.name} » n'a pas de catégorie`;
        if (!(p.price >= 0) || !isFinite(p.price)) return where(), `Prix invalide pour « ${p.name} »`;
        if (p.sizes.some((s) => !String(s.label).trim())) return where(), `Une taille de « ${p.name} » n'a pas de nom`;
        seenP.add(p.id);
      }
      return "";
    }
    async function save() {
      const bad = problems();
      if (bad) { render(); return status("bad", bad); }
      st.prods.forEach((p) => { p.images = p.images.filter(Boolean); p.popularity = Math.max(0, Math.min(100, Math.round(p.popularity || 0))); });
      $("#save").disabled = true; status("dirty", "Enregistrement");
      try {
        const r = await fetch("/api/sauver", { method: "POST", headers: { "Content-Type": "application/json", "X-Biboulab-Admin": "1" }, body: JSON.stringify({ categories: st.cats, products: st.prods }) });
        const out = await r.json(); if (!r.ok) throw new Error(out.erreur);
        st.dirty = false; st.fresh.clear(); st.manualId.clear();
        status("saved", `Enregistré à ${new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`);
        form();
      } catch (err) { status("bad", err.message || "Enregistrement impossible"); $("#save").disabled = false; }
    }
    $("#save").addEventListener("click", save);
    addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); if (st.dirty && st.canSave) save(); } });
    addEventListener("beforeunload", (e) => { if (st.dirty || O.pending) e.preventDefault(); });

    function render() { counts(); tools(); list(); form(); }

    /* =====================================================================
       COMMANDES — tableau façon Trello : Commande → En cours d'impression → À livrer
       Chaque commande est un ticket qu'on glisse d'une colonne à l'autre ; un clic
       ouvre sa fiche. Tout est enregistré automatiquement dans outils/commandes.json.
       ===================================================================== */
    const STEPS = [
      { id: "commande", label: "Commande", next: "Lancer l'impression" },
      { id: "impression", label: "En cours d'impression", next: "Imprimée" },
      { id: "livrer", label: "À livrer", next: "Livrée" }
    ];
    const STEP_NAME = { commande: "Commande", impression: "En cours d'impression", livrer: "À livrer", livree: "Livrée" };
    const NEXT = { commande: "impression", impression: "livrer", livrer: "livree" };
    const API = { "X-Biboulab-Admin": "1" };
    const O = { list: [], ready: false, error: "", q: "", done: false, open: null, drag: null, res: [], act: 0, timer: 0, seq: 0, pending: false, queue: Promise.resolve() };
    const byId = (id) => O.list.find((o) => o.id === id);
    const prodOf = (id) => id && st.prods.find((p) => p.id === id);
    const round = (n) => Math.round((+n || 0) * 100) / 100;
    const lineTotal = (it) => round((+it.qty || 0) * (+it.price || 0));
    const subTotal = (o) => round(o.items.reduce((s, it) => s + lineTotal(it), 0));
    const orderTotal = (o) => round(subTotal(o) + (+o.shippingFee || 0));
    const optsOf = (it) => [it.color && FILAMENTS[it.color] ? FILAMENTS[it.color].name : "", it.size || "", it.options || ""].filter(Boolean).join(" · ");
    const shortDate = (d) => (d ? new Date(d + "T12:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) : "");
    const hhmm = () => new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const newRef = () => "GF-" + Date.now().toString(36).toUpperCase().slice(-6); // même format que les commandes du site
    const isEmpty = (o) => !o.items.length && !o.client.trim() && !o.email.trim() && !o.adresse.trim() && !o.note.trim();
    const blank = (step) => {
      const m = SITE.shipping.methods[0], pay = SITE.payment.methods[0];
      return { id: uid(), ref: newRef(), status: step, date: today(), moved: today(), client: "", email: "", adresse: "", items: [],
        shipping: m ? m.label : "", shippingFee: m ? m.price : 0, payment: pay ? pay.label : "", paid: false, tracking: "", note: "" };
    };

    /* Vignette d'un objet : sa première photo, sinon le visuel aux couleurs de sa catégorie (comme sur le site) */
    const srcOf = (s) => (/^(https?:|data:|\/)/.test(s) ? s : "../" + s);
    function pThumb(p, cls = "o-th") {
      if (!p) return `<span class="${cls} o-art o-none" aria-hidden="true">${icon("box")}</span>`;
      if (p.images && p.images[0]) return `<img class="${cls}" src="${esc(srcOf(p.images[0]))}" alt="" loading="lazy" decoding="async">`;
      const c = catOf(p.category) || st.cats[0] || {};
      return `<span class="${cls} o-art" style="--c:${esc(c.color)};--c2:${esc(c.color2)}" aria-hidden="true">${icon(c.icon)}</span>`;
    }

    /* ---------- Enregistrement automatique ---------- */
    function persist() {
      clearTimeout(O.timer); O.pending = true; status("dirty", "Enregistrement…", "commandes");
      O.timer = setTimeout(() => {
        const seq = ++O.seq, body = JSON.stringify({ commandes: O.list });
        O.queue = O.queue
          .then(() => fetch("/api/commandes", { method: "POST", headers: { ...API, "Content-Type": "application/json" }, body }))
          .then(async (r) => { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).erreur || "Enregistrement impossible"); })
          .then(() => { if (seq === O.seq) { O.pending = false; status("saved", `Commandes enregistrées à ${hhmm()}`, "commandes"); } })
          .catch((err) => status("bad", `${err.message || "Enregistrement impossible"} : ces changements ne sont pas sauvegardés`, "commandes"));
      }, 350);
    }
    function changed() { board(); obar(); persist(); }

    /* ---------- Barre d'outils et tableau ---------- */
    function obar() {
      const active = O.list.filter((o) => o.status !== "livree"), due = active.filter((o) => !o.paid).length, done = O.list.length - active.length;
      $("#o-sum").textContent = O.ready ? `${active.length} commande${active.length > 1 ? "s" : ""} en cours${due ? ` · ${due} à encaisser` : ""}` : "";
      $("#o-done").textContent = O.done ? "Retour au tableau" : `Livrées · ${done}`;
      $("#o-done").setAttribute("aria-pressed", O.done);
      const b = $("#o-badge"); b.textContent = active.length; b.hidden = !active.length;
      ["#o-q", "#o-paste", "#o-done"].forEach((s) => { $(s).disabled = !O.ready; });
    }
    const hay = (o) => slugify([o.ref, o.client, o.email, o.adresse, o.note, o.tracking, o.payment, o.shipping, ...o.items.map((it) => it.name + " " + optsOf(it))].join(" "));
    const matches = (o) => { const w = slugify(O.q).split("-").filter(Boolean); return !w.length || w.every((x) => hay(o).includes(x)); };

    function ticket(o) {
      const prods = [...new Set(o.items.map((it) => it.product))].map(prodOf).filter(Boolean).slice(0, 3);
      const nextLabel = STEPS.find((x) => x.id === o.status)?.next;
      return `<article class="o-card" draggable="true" data-id="${esc(o.id)}">
          ${prods.length ? `<div class="o-cover" style="--n:${prods.length}">${prods.map((p) => pThumb(p, "o-cv")).join("")}</div>` : ""}
          <div class="o-cb">
            <div class="o-labels"><span class="o-lab ${o.paid ? "ok" : "due"}">${o.paid ? "Payée" : "À encaisser"}</span>${o.note.trim() ? `<span class="o-lab">Note</span>` : ""}${o.tracking ? `<span class="o-lab">Suivi</span>` : ""}</div>
            <h3><button class="o-open" type="button" data-open="${esc(o.id)}">${esc(o.client) || "Client à renseigner"}</button></h3>
            <p class="o-sub">${esc(o.ref) || "Sans référence"} · ${esc(shortDate(o.date))}${o.status === "livrer" && o.shipping ? ` · ${esc(o.shipping)}` : ""}</p>
            ${o.items.length ? `<ul class="o-items">${o.items.map((it) => `<li><span class="o-q">${+it.qty || 0} ×</span><span>${esc(it.name) || "Objet"}${optsOf(it) ? ` <small>${esc(optsOf(it))}</small>` : ""}</span></li>`).join("")}</ul>` : `<p class="o-sub">Aucun objet</p>`}
            <div class="o-foot"><b>${euro(orderTotal(o))}</b>${nextLabel ? `<button class="o-next" type="button" data-next="${esc(o.id)}">${esc(nextLabel)} ${icon(o.status === "livrer" ? "check" : "arrow")}</button>` : ""}</div>
          </div></article>`;
    }
    function board() {
      const box = $("#board");
      if (!O.ready) {
        box.className = "o-board";
        box.innerHTML = `<div class="o-msg"><h2>Suivi des commandes indisponible</h2><p>${O.error ? esc(O.error) : "Le suivi des commandes s'enregistre sur cet ordinateur. Lancez <code>node outils/serveur-local.js</code> dans le dossier du site, puis ouvrez <code>http://localhost:4173/admin#commandes</code>"}</p></div>`;
        return;
      }
      if (O.done) {
        const rows = O.list.filter((o) => o.status === "livree" && matches(o)).sort((a, b) => (b.moved || "").localeCompare(a.moved || ""));
        box.className = "o-board o-done";
        box.innerHTML = `<h2>Commandes livrées</h2>${rows.map((o) => `<div class="o-row">
            <button class="o-open" type="button" data-open="${esc(o.id)}"><b>${esc(o.client) || "Client"}</b> <span>· ${esc(o.ref)} · ${((n) => `${n} objet${n > 1 ? "s" : ""}`)(o.items.reduce((s, it) => s + (+it.qty || 0), 0))}</span></button>
            <span class="num">livrée le ${esc(shortDate(o.moved))}</span><b>${euro(orderTotal(o))}</b>
            <button class="o-next" type="button" data-back="${esc(o.id)}">Remettre à livrer</button></div>`).join("") || `<p class="o-empty">${O.q ? "Aucun résultat" : "Aucune commande livrée pour l'instant"}</p>`}`;
        return;
      }
      box.className = "o-board";
      box.innerHTML = STEPS.map((s) => {
        const cards = O.list.filter((o) => o.status === s.id && matches(o));
        return `<section class="o-col" data-col="${s.id}" aria-labelledby="col-${s.id}">
            <header class="o-ch"><h2 id="col-${s.id}">${s.label}</h2><span class="num">${cards.length}</span></header>
            <div class="o-list">${cards.map(ticket).join("") || `<p class="o-empty">${O.q ? "Aucun résultat" : "Glissez une commande ici"}</p>`}</div>
            <button class="o-add" type="button" data-add="${s.id}">${icon("plus")} Ajouter une commande</button>
          </section>`;
      }).join("");
    }
    function moveTo(o, step, beforeId) {
      O.list.splice(O.list.indexOf(o), 1);
      if (o.status !== step) { o.status = step; o.moved = today(); }
      const at = beforeId ? O.list.indexOf(byId(beforeId)) : -1;
      if (at >= 0) O.list.splice(at, 0, o); else O.list.push(o); // en bas de la colonne
      changed();
    }
    function create(step, from) {
      const o = Object.assign(blank(step), from || {});
      O.list.push(o); O.q = ""; $("#o-q").value = ""; O.done = false; changed(); openOrder(o, !from);
    }

    const boardEl = $("#board");
    boardEl.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.open) return openOrder(byId(b.dataset.open));
      if (b.dataset.next) { const o = byId(b.dataset.next); return moveTo(o, NEXT[o.status]); }
      if (b.dataset.back) return moveTo(byId(b.dataset.back), "livrer");
      if (b.dataset.add) return create(b.dataset.add);
    });
    /* Glisser-déposer des tickets entre colonnes (et dans une colonne pour les réordonner) */
    const clearDrops = () => $$(".drop, .drop-before, .drop-end", boardEl).forEach((x) => x.classList.remove("drop", "drop-before", "drop-end"));
    function dropAt(e) {
      const col = e.target.closest(".o-col"); if (!col || !O.drag) return null;
      const before = $$(".o-card", col).filter((c) => c.dataset.id !== O.drag).find((c) => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
      return { col, before };
    }
    boardEl.addEventListener("dragstart", (e) => {
      const c = e.target.closest(".o-card"); if (!c) return;
      O.drag = c.dataset.id; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", c.dataset.id);
      requestAnimationFrame(() => c.classList.add("dragging"));
    });
    boardEl.addEventListener("dragover", (e) => {
      const t = dropAt(e); clearDrops(); if (!t) return;
      e.preventDefault(); e.dataTransfer.dropEffect = "move";
      t.col.classList.add("drop"); if (t.before) t.before.classList.add("drop-before"); else $(".o-list", t.col).classList.add("drop-end");
    });
    boardEl.addEventListener("dragleave", (e) => { if (!boardEl.contains(e.relatedTarget)) clearDrops(); });
    boardEl.addEventListener("dragend", () => { O.drag = null; clearDrops(); $$(".dragging", boardEl).forEach((x) => x.classList.remove("dragging")); });
    boardEl.addEventListener("drop", (e) => {
      const t = dropAt(e); if (!t) return; e.preventDefault();
      const o = byId(O.drag); O.drag = null; clearDrops();
      if (o) moveTo(o, t.col.dataset.col, t.before && t.before.dataset.id);
    });
    $("#o-q").addEventListener("input", (e) => { O.q = e.target.value; board(); });
    $("#o-done").addEventListener("click", () => { O.done = !O.done; obar(); board(); });

    /* ---------- Fiche d'une commande ---------- */
    const dlg = $("#o-dlg");
    const options = (list, v) => [...new Set([...list, ...(v ? [v] : [])])].map((x) => `<option${x === v ? " selected" : ""}>${esc(x)}</option>`).join("");
    function lines(o) {
      if (!o.items.length) return `<p class="hint" style="margin:0">Aucun objet pour l'instant. Cherchez-le ci-dessus par son nom</p>`;
      return o.items.map((it, i) => {
        const p = prodOf(it.product), sizes = p ? p.sizes : [], colors = p ? [...new Set([...p.colors, ...(it.color ? [it.color] : [])])] : [];
        return `<div class="o-line">
            ${pThumb(p, "o-lth")}
            <div class="o-lname"><b>${esc(it.name) || "Objet"}</b>${p ? `<a href="../produit.html?id=${esc(p.id)}" target="_blank" rel="noopener">Voir sur le site</a>` : `<small>Hors catalogue</small>`}</div>
            <b class="o-ltot" data-ltot="${i}">${euro(lineTotal(it))}</b>
            <button class="rm" type="button" data-rm-line="${i}" aria-label="Retirer ${esc(it.name)}">${icon("trash")}</button>
            <div class="o-lctl">
              ${colors.length ? `<select class="select" data-it="${i}" data-f="color" aria-label="Couleur de ${esc(it.name)}"><option value="">Couleur ?</option>${colors.map((k) => `<option value="${esc(k)}"${k === it.color ? " selected" : ""}>${esc(FILAMENTS[k] ? FILAMENTS[k].name : k)}</option>`).join("")}</select>` : ""}
              ${sizes.length ? `<select class="select" data-it="${i}" data-f="size" aria-label="Taille de ${esc(it.name)}">${options(sizes.map((z) => z.label), it.size)}</select>` : ""}
              ${p ? "" : `<input class="input o-opts" data-it="${i}" data-f="options" value="${esc(it.options || "")}" placeholder="Couleur, taille…" aria-label="Options de ${esc(it.name)}">`}
              <label class="o-mini">Qté <input class="input" type="number" min="1" step="1" inputmode="numeric" data-it="${i}" data-f="qty" value="${esc(it.qty)}"></label>
              <label class="o-mini p">Prix unitaire <input class="input" type="number" min="0" step="0.1" inputmode="decimal" data-it="${i}" data-f="price" value="${esc(it.price)}"></label>
            </div></div>`;
      }).join("");
    }
    function totals(o) {
      const set = (id, v) => { const el = $(id, dlg); if (el) el.textContent = v; };
      set("#o-subt", euro(subTotal(o))); set("#o-feet", +o.shippingFee ? euro(o.shippingFee) : "Offerte"); set("#o-total", euro(orderTotal(o)));
    }
    function detail(o) {
      const F2 = (k, label, extra = "") => `<div class="fg"><label for="o-${k}">${label}</label><input class="input" id="o-${k}" data-o="${k}" value="${esc(o[k])}" autocomplete="off" ${extra}></div>`;
      return `<div class="o-in-wrap">
          <div class="o-dh"><div>
              <label class="sr" for="o-ref">Référence de la commande</label><input class="o-title" id="o-ref" data-o="ref" value="${esc(o.ref)}" placeholder="Référence" autocomplete="off">
              <p class="o-where"><span id="o-who">${o.client ? `Commande de ${esc(o.client)}` : "Nouvelle commande"}</span> · <label for="o-status">dans la colonne</label>
                <select class="select" id="o-status" data-o="status">${["commande", "impression", "livrer", "livree"].map((k) => `<option value="${k}"${k === o.status ? " selected" : ""}>${STEP_NAME[k]}</option>`).join("")}</select></p>
            </div><button class="o-x" type="button" data-close aria-label="Fermer la fiche">${icon("plus")}</button></div>
          <div>
            <section class="o-ds"><h3>Objets commandés</h3>
              <div class="o-find"><div class="field">${icon("search")}<label class="sr" for="o-find">Rechercher un objet du site</label>
                <input class="input" id="o-find" type="search" role="combobox" aria-expanded="false" aria-controls="o-res" aria-autocomplete="list" placeholder="Rechercher un objet du site pour l'ajouter" autocomplete="off"></div>
                <div class="o-res" id="o-res" role="listbox" aria-label="Objets du site" hidden></div></div>
              <div class="o-lines" id="o-lines">${lines(o)}</div>
              <dl class="o-tot"><div><dt>Objets</dt><dd id="o-subt"></dd></div><div><dt>Livraison</dt><dd id="o-feet"></dd></div><div class="t"><dt>Total</dt><dd id="o-total"></dd></div></dl>
            </section>
            <section class="o-ds"><h3><label for="o-note">Note</label></h3><textarea class="textarea" id="o-note" data-o="note" placeholder="Précision du client, idée de finition, rappel…">${esc(o.note)}</textarea></section>
          </div>
          <aside class="o-side">
            <section><h3>Client</h3>
              ${F2("client", "Nom", 'autocomplete="off" placeholder="Prénom Nom"')}
              ${F2("email", "E-mail", 'type="email" placeholder="client@exemple.fr"')}
              <a class="o-mailto" id="o-mailto" href="#" ${o.email ? "" : "hidden"}>Écrire au client</a>
              <div class="fg"><label for="o-adresse">Adresse</label><textarea class="textarea" id="o-adresse" data-o="adresse" rows="3" placeholder="Rue&#10;Code postal Ville">${esc(o.adresse)}</textarea></div>
            </section>
            <section><h3>Paiement</h3>
              <div class="fg"><label for="o-payment">Moyen de paiement</label><select class="select" id="o-payment" data-o="payment">${options(SITE.payment.methods.map((m) => m.label), o.payment)}</select></div>
              <label class="o-check"><input type="checkbox" data-o="paid"${o.paid ? " checked" : ""}> Paiement reçu</label>
            </section>
            <section><h3>Livraison</h3>
              <div class="o-two"><div class="fg"><label for="o-shipping">Mode</label><select class="select" id="o-shipping" data-o="shipping">${options([...SITE.shipping.methods.map((m) => m.label), "Remise en main propre"], o.shipping)}</select></div>
                <div class="fg"><label for="o-shippingFee">Frais (€)</label><input class="input" id="o-shippingFee" data-o="shippingFee" type="number" min="0" step="0.1" inputmode="decimal" value="${esc(o.shippingFee)}"></div></div>
              <p class="hint">Offerte dès ${euro(SITE.shipping.freeFrom)} d'achats</p>
              ${F2("tracking", "Numéro de suivi", 'placeholder="À remplir à l\'envoi"')}
            </section>
            <section>${F2("date", "Date de la commande", 'type="date"')}
              <button class="btn btn-ghost btn-danger" type="button" data-del>${icon("trash")} Supprimer la commande</button></section>
          </aside></div>`;
    }
    function mailto(o) { const a = $("#o-mailto", dlg); if (!a) return; a.hidden = !o.email; a.href = `mailto:${o.email}?subject=${encodeURIComponent(`Votre commande ${o.ref} — ${SITE.name}`)}`; }
    function openOrder(o, find) {
      if (!o) return;
      O.open = o; dlg.innerHTML = detail(o); dlg.setAttribute("aria-label", `Commande ${o.ref || ""}`);
      totals(o); mailto(o);
      if (!dlg.open) dlg.showModal();
      (find ? $("#o-find", dlg) : $(".o-x", dlg)).focus();
    }
    function refreshLines() { const o = O.open; $("#o-lines", dlg).innerHTML = lines(o); totals(o); }

    /* Recherche d'un objet du site : nom, catégorie, identifiant */
    function results(q) {
      const words = slugify(q).split("-").filter(Boolean);
      const text = (p) => slugify([p.name, p.id, pathName(catOf(p.category)), p.short].join(" "));
      const found = st.prods.filter((p) => words.every((w) => text(p).includes(w)));
      return (words.length ? found : found.sort((a, b) => (b.popularity || 0) - (a.popularity || 0))).slice(0, 8);
    }
    function showResults() {
      const inp = $("#o-find", dlg), box = $("#o-res", dlg); if (!inp) return;
      O.res = results(inp.value); O.act = 0;
      box.innerHTML = O.res.length
        ? O.res.map((p, i) => `<div class="o-opt" role="option" id="o-opt-${i}" data-pick="${i}" aria-selected="${i === O.act}">${pThumb(p)}<span><b>${esc(p.name)}</b><small>${esc(pathName(catOf(p.category)))}</small></span><span class="num">${euro(p.price)}</span></div>`).join("")
        : `<p class="o-nores">Aucun objet du site ne correspond</p>`;
      box.hidden = false; inp.setAttribute("aria-expanded", "true");
      if (O.res.length) inp.setAttribute("aria-activedescendant", "o-opt-0"); else inp.removeAttribute("aria-activedescendant");
    }
    function hideResults() { const box = $("#o-res", dlg), inp = $("#o-find", dlg); if (!box) return; box.hidden = true; inp.setAttribute("aria-expanded", "false"); inp.removeAttribute("aria-activedescendant"); }
    function activate(i) {
      O.act = (i + O.res.length) % O.res.length;
      $$(".o-opt", dlg).forEach((x, j) => x.setAttribute("aria-selected", j === O.act));
      const el = $(`#o-opt-${O.act}`, dlg); $("#o-find", dlg).setAttribute("aria-activedescendant", el.id); el.scrollIntoView({ block: "nearest" });
    }
    function addLine(p) {
      const o = O.open, size = p.sizes[0];
      const it = { product: p.id, name: p.name, color: p.colors[0] || null, size: size ? size.label : null, qty: 1, price: round(p.price + (size ? +size.extra || 0 : 0)) };
      const same = o.items.find((x) => x.product === it.product && x.color === it.color && x.size === it.size);
      if (same) same.qty = (+same.qty || 0) + 1; else o.items.push(it);
      const inp = $("#o-find", dlg); inp.value = ""; hideResults(); refreshLines(); changed(); inp.focus();
    }

    dlg.addEventListener("input", (e) => {
      const t = e.target, o = O.open; if (!o) return;
      if (t.id === "o-find") return showResults();
      if (t.dataset.o) {
        const k = t.dataset.o;
        if (k === "paid") o.paid = t.checked;
        else if (k === "shippingFee") o.shippingFee = t.value === "" ? 0 : round(t.value.replace(",", "."));
        else o[k] = t.value;
        if (k === "status") o.moved = today();
        if (k === "shipping") { // frais du mode choisi, ou offerts au-delà du seuil
          const m = SITE.shipping.methods.find((x) => x.label === t.value);
          o.shippingFee = !m || subTotal(o) >= SITE.shipping.freeFrom ? 0 : m.price; $("#o-shippingFee", dlg).value = o.shippingFee;
        }
        if (k === "client") $("#o-who", dlg).textContent = o.client ? `Commande de ${o.client}` : "Nouvelle commande";
        if (k === "email" || k === "ref") mailto(o);
        if (k === "ref") dlg.setAttribute("aria-label", `Commande ${o.ref}`);
      } else if (t.dataset.it !== undefined) {
