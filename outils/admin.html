        const i = +t.dataset.it, it = o.items[i], f = t.dataset.f, p = prodOf(it.product);
        if (f === "qty") it.qty = Math.max(1, Math.round(+t.value) || 1);
        else if (f === "price") it.price = t.value === "" ? 0 : round(t.value.replace(",", "."));
        else if (f === "color") it.color = t.value || null;
        else if (f === "options") it.options = t.value;
        else if (f === "size") { // le prix suit la taille choisie
          it.size = t.value; const z = p && p.sizes.find((x) => x.label === t.value);
          if (z) { it.price = round(p.price + (+z.extra || 0)); $(`[data-it="${i}"][data-f="price"]`, dlg).value = it.price; }
        }
        $(`[data-ltot="${i}"]`, dlg).textContent = euro(lineTotal(it));
      } else return;
      totals(o); changed();
    });
    dlg.addEventListener("click", (e) => {
      if (e.target === dlg) return dlg.close(); // clic sur le fond : on ferme, comme Trello
      const pick = e.target.closest("[data-pick]"); if (pick) return addLine(O.res[+pick.dataset.pick]);
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.close !== undefined) return dlg.close();
      if (b.dataset.rmLine !== undefined) { O.open.items.splice(+b.dataset.rmLine, 1); refreshLines(); return changed(); }
      if (b.dataset.del !== undefined) {
        if (!confirm(`Supprimer la commande ${O.open.ref || ""} ${O.open.client ? `de ${O.open.client} ` : ""}?\nElle disparaît du tableau définitivement.`)) return;
        O.list.splice(O.list.indexOf(O.open), 1); O.open = null; dlg.close(); changed();
      }
    });
    dlg.addEventListener("pointerdown", (e) => { if (e.target.closest(".o-opt")) e.preventDefault(); }); // garde le curseur dans la recherche
    dlg.addEventListener("focusin", (e) => { if (e.target.id === "o-find") showResults(); });
    dlg.addEventListener("focusout", (e) => { if (e.target.id === "o-find" && !(e.relatedTarget && e.relatedTarget.closest(".o-find"))) hideResults(); });
    dlg.addEventListener("keydown", (e) => {
      if (e.target.id !== "o-find" || $("#o-res", dlg).hidden) return;
      if (e.key === "ArrowDown" && O.res.length) { e.preventDefault(); activate(O.act + 1); }
      else if (e.key === "ArrowUp" && O.res.length) { e.preventDefault(); activate(O.act - 1); }
      else if (e.key === "Enter") { e.preventDefault(); if (O.res[O.act]) addLine(O.res[O.act]); }
    });
    dlg.addEventListener("cancel", (e) => { const box = $("#o-res", dlg); if (box && !box.hidden) { e.preventDefault(); hideResults(); } }); // Échap ferme d'abord la liste
    dlg.addEventListener("close", () => {
      const o = O.open; O.open = null;
      if (o && isEmpty(o)) { O.list.splice(O.list.indexOf(o), 1); changed(); } // ticket créé puis laissé vide : on l'enlève
      else board();
    });

    /* ---------- Créer une commande en collant l'e-mail reçu du site ---------- */
    function parseMail(text) {
      const rows = String(text).replace(/\r/g, "").split("\n").map((l) => l.replace(/^\s*(>\s*)+/, "").trim());
      const all = rows.join("\n");
      const num = (s) => { const v = parseFloat(String(s).replace(/[^\d,.-]/g, "").replace(",", ".")); return isFinite(v) ? v : 0; };
      const o = blank("commande"); o.payment = ""; o.shipping = ""; o.shippingFee = 0;
      const ref = all.match(/Commande\s+([A-Z0-9]+-[A-Z0-9]+)/i); if (ref) o.ref = ref[1].toUpperCase();
      for (const l of rows) { // « - 2 × Dragon articulé (Noir · 15 cm) : 24,00 € »
        const m = l.match(/^[-•*]\s*(\d+)\s*[×x]\s*(.+?)\s*:\s*([\d\s\u00a0\u202f.,]+)\s*€?$/); if (!m) continue;
        let name = m[2].trim(), opts = "";
        const par = name.match(/^(.*?)\s*\(([^()]*)\)$/); if (par) { name = par[1]; opts = par[2]; }
        const qty = Math.max(1, +m[1] || 1), p = st.prods.find((x) => slugify(x.name) === slugify(name));
        const it = { product: p ? p.id : null, name: p ? p.name : name, color: null, size: null, qty, price: round(num(m[3]) / qty) };
        const rest = [];
        opts.split("·").map((x) => x.trim()).filter(Boolean).forEach((x) => {
          const col = p && Object.keys(FILAMENTS).find((k) => slugify(FILAMENTS[k].name) === slugify(x));
          const size = p && p.sizes.find((z) => slugify(z.label) === slugify(x));
          if (col) it.color = col; else if (size) it.size = size.label; else rest.push(x);
        });
        if (rest.length) it.options = rest.join(" · ");
        o.items.push(it);
      }
      const sh = all.match(/Livraison\s*\(([^)]+)\)\s*:\s*(.+)/i);
      if (sh) { o.shipping = sh[1].trim(); o.shippingFee = /offert/i.test(sh[2]) ? 0 : round(num(sh[2])); }
      const pay = all.match(/Paiement souhait[ée]\s*:\s*(.+)/i); if (pay) o.payment = pay[1].trim();
      const at = rows.findIndex((l) => /^Livraison\s*:\s*$/i.test(l));
      if (at >= 0) { // bloc d'adresse : nom, rue, code postal et ville, e-mail, précision
        const block = [];
        for (const l of rows.slice(at + 1)) { if (!l) { if (block.length) break; continue; } block.push(l); }
        const addr = [];
        block.forEach((l) => {
          const pr = l.match(/^Précision\s*:\s*(.*)$/i);
          if (pr) o.note = pr[1]; else if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(l)) o.email = l; else if (!o.client) o.client = l; else addr.push(l);
        });
        o.adresse = addr.join("\n");
      }
      return o.items.length || o.client || o.email ? o : null;
    }
    const mail = $("#o-mail");
    $(".o-x", mail).innerHTML = icon("plus");
    $("#o-paste").addEventListener("click", () => { $("#o-mailt").value = ""; $("#o-mailerr").textContent = ""; mail.showModal(); $("#o-mailt").focus(); });
    mail.addEventListener("click", (e) => { if (e.target === mail || e.target.closest("[data-close]")) mail.close(); });
    $("#o-mailf").addEventListener("submit", (e) => {
      e.preventDefault();
      const o = parseMail($("#o-mailt").value), err = $("#o-mailerr");
      if (!o) { err.textContent = "Je ne reconnais pas de commande dans ce texte. Collez l'e-mail en entier, depuis « Commande GF-… »"; return; }
      const twin = O.list.find((x) => x.ref && x.ref === o.ref);
      if (twin) { err.textContent = `La commande ${o.ref} est déjà dans le tableau (${STEP_NAME[twin.status]}).`; return; }
      mail.close(); create("commande", o);
    });

    /* ---------- Onglets ---------- */
    function setTab() {
      tab = location.hash === "#commandes" ? "commandes" : "catalogue";
      $$(".a-tab").forEach((a) => a.setAttribute("aria-current", a.dataset.tab === tab ? "page" : "false"));
      $(".a-shell").hidden = tab !== "catalogue"; $("#orders").hidden = tab !== "commandes";
      $("#save").hidden = $("#counts").hidden = tab !== "catalogue";
      $("#warn").hidden = st.canSave || tab !== "catalogue";
      document.title = `${tab === "commandes" ? "Commandes" : "Catalogue"} | Administration Biboulab`;
      paintStatus();
    }
    addEventListener("hashchange", setTab);

    /* ---------- Démarrage ---------- */
    render();
    setTab(); obar(); board();
    fetch("/api/etat").then((r) => r.json()).then((o) => { st.canSave = !!o.ok; }).catch(() => {}).finally(() => {
      setTab();
      if (st.dirty) $("#save").disabled = !st.canSave;
      form();
    });
    fetch("/api/commandes", { headers: API })
      .then(async (r) => { const out = await r.json(); if (!r.ok) throw new Error(out.erreur); O.list = Array.isArray(out.commandes) ? out.commandes : []; O.ready = true; })
      .catch((err) => { O.error = err instanceof TypeError ? "" : err.message; })
      .finally(() => { obar(); board(); });
  })();
