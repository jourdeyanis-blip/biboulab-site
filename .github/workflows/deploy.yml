name: Déploiement O2switch

# Chaque push sur la branche main publie le site sur l'hébergement O2switch.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Diagnostic FTP (temporaire)
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          C="curl -sS --ssl-reqd --insecure --user $FTP_USERNAME:$FTP_PASSWORD"
          echo "=== Racine vue par le compte FTP ==="
          $C "ftp://$FTP_SERVER/" -Q "PWD" -v 2>&1 | grep -E '^< (2|5)|^[d-][rwx-]{9}' || true
          echo "=== Creation d'un dossier de test a la racine ==="
          $C "ftp://$FTP_SERVER/" -Q "MKD diagtest" -v 2>&1 | grep -E '^< (2|5)|curl:' || true
          echo "=== Nettoyage ==="
          $C "ftp://$FTP_SERVER/" -Q "RMD diagtest" -v 2>&1 | grep -E '^< (2|5)|curl:' || true

      - name: Envoyer le site en FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /home/tenu2670/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            outils/**
            .claude/**
            LISEZ-MOI.md
            .DS_Store
