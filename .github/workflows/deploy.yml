name: Déploiement O2switch

# Chaque push sur la branche main publie le site sur l'hébergement O2switch.
# Le compte FTP est déjà placé dans public_html : on envoie donc à la racine (/).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer le site en FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:max-retries 3;
            mirror -R --verbose --parallel=2 \
              -X '.git*' -X '.github/' -X 'outils/' -X '.claude/' \
              -X 'LISEZ-MOI.md' -X '.DS_Store' \
              . /;
            quit"
